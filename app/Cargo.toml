[package]
name = "workploy"
version = "0.1.9"
edition = "2024"
description = "Workploy — CI/CD & Deploy self-hosted"

[dependencies]
rune = { path = "../vendor/rune/crates/rune" }
rune-kit = { path = "../vendor/rune/crates/rune-kit" }
rune-fx = { path = "../vendor/rune/crates/rune-fx" }
rune-motion = { path = "../vendor/rune/crates/rune-motion" }
wgpu = { version = "~30.0.1", default-features = false, features = ["std", "parking_lot", "metal", "wgsl", "dx12", "vulkan"] }
bytemuck = { version = "1.25", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
keyring-core = "1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "1.1", default-features = false }

[build-dependencies]
winresource = "0.1"

[patch.crates-io]
wgpu-hal = { path = "../vendor/rune/vendor/wgpu-hal" }
winit = { path = "../vendor/rune/vendor/winit" }
parley_engine = { path = "../vendor/rune/vendor/parley_engine" }
accesskit_windows = { path = "../vendor/rune/vendor/accesskit_windows" }
accesskit_macos = { path = "../vendor/rune/vendor/accesskit_macos" }

[profile.dev]
debug = "line-tables-only"
[profile.dev.package."*"]
debug = false
[profile.release]
opt-level = 2
strip = "symbols"
lto = "thin"
