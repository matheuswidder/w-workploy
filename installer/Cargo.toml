[package]
name = "workploy-setup"
version = "0.1.6"
edition = "2024"
description = "Instalador nativo do Workploy para Windows"

[dependencies]
flate2 = "1"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
flate2 = "1"
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
strip = true
